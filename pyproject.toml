[project]
name = "orders-api"
version = "0.1.0"
description = "An Api from Noor Foods orders"
readme = "README.md"
authors = [
    { name = "Rani Bano", email = "ranibano.kiu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "fastapi-cli>=0.0.33",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "orders_api.main:app"
